<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <!-- Hidden shadow form: lets Netlify detect the form at build time. Used as
         the fallback capture for the /contact page when the primary CRM is
         unreachable (see app/contact/page.tsx submitToNetlify). Fields mirror
         what that fallback posts so nothing is dropped. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="text" />
      <input name="company" type="text" />
      <input name="jobTitle" type="text" />
      <input name="country" type="text" />
      <input name="interest" type="text" />
      <textarea name="message"></textarea>
      <input name="bot-field" type="text" />
    </form>

    <!-- Investor Deck requests. Set the email notification for this form to
         chris@mediastreamai.com in the Netlify dashboard. -->
    <form name="investor-deck" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="investor-deck" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="company" type="text" />
      <input name="bot-field" type="text" />
    </form>
  </body>
</html>
