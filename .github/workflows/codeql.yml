# Cyber Essentials / Secure Configuration: GitHub CodeQL static analysis.
# Requires GitHub code scanning (Advanced Security) enabled on the repo.
# Runs on the default branch and weekly so pull-request checks stay driven
# by the portable security-scan workflow (Semgrep + gitleaks).
name: CodeQL
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
