# Netlify config for the Media Stream AI group site (Next.js, SSR).
# The @netlify/plugin-nextjs adapter handles SSR, route handlers and the
# publish directory — do not hand-set `publish`.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ------------------------------------------------------------------
# External service links
# ------------------------------------------------------------------
[[redirects]]
  from = "/mother"
  to = "https://mother.mediastreamai.com"
  status = 301

[[redirects]]
  from = "/gpu"
  to = "https://gpu.mediastreamai.com"
  status = 301

[[redirects]]
  from = "/studio"
  to = "https://studio.intuitv.app"
  status = 301

# ------------------------------------------------------------------
# Legacy routes from the previous mediastreamai.com site → closest page
# on the rebuilt group site, so existing links and indexed URLs survive.
